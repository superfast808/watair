services:
  web:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-8093}:8080"
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

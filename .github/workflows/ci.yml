name: WatAir CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --omit=dev --no-audit --no-fund
      - run: npm run check

      - name: Smoke-test public site and CMS
        env:
          NODE_ENV: production
          PORT: 8099
          BASE_URL: https://watairuk.co.uk
          SESSION_SECRET: ci-only-session-secret-12345678901234567890
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-test-password-123456789
        run: |
          set -euo pipefail
          APP_VERSION=$(node -p "require('./package.json').version")

          # Exercise the opt-in commerce path without enabling commerce in normal defaults.
          node <<'NODE'
          const { db } = require('./src/db');
          const upsert = db.prepare('INSERT INTO settings(key,value) VALUES(?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value');
          upsert.run('commerce_enabled','1');
          upsert.run('commerce_currency','GBP');
          upsert.run('commerce_manual_enabled','1');
          upsert.run('catalogue_hero_eyebrow','CI catalogue eyebrow');
          upsert.run('catalogue_hero_title','CI editable catalogue hero');
          upsert.run('catalogue_hero_text','Catalogue hero content managed from Site Settings.');
          upsert.run('catalogue_hero_image','/uploads/imported/legacy/media/1070/10000l-pro.png');
          upsert.run('catalogue_hero_image_style','graphic');
          db.prepare("UPDATE products SET sellable=1,price_minor=129900,delivery_class='standard',max_order_qty=2 WHERE slug='pw-hr-20l'").run();
          db.prepare("INSERT INTO delivery_rules(name,delivery_class,country_code,postcode_prefixes,price_minor,priority,active) VALUES('CI UK delivery','standard','GB','',2500,100,1)").run();
          db.close();
          NODE

          node server.js > /tmp/watair.log 2>&1 &
          APP_PID=$!
          trap 'STATUS=$?; if [ "$STATUS" -ne 0 ]; then echo "--- WatAir server log ---"; cat /tmp/watair.log || true; fi; kill $APP_PID 2>/dev/null || true; exit $STATUS' EXIT

          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8099/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          grep -q '"ok":true' /tmp/health.json

          curl -fsS http://127.0.0.1:8099/ > /tmp/home.html
          curl -fsS http://127.0.0.1:8099/products > /tmp/products.html
          curl -fsS http://127.0.0.1:8099/products/home-office > /tmp/products-home.html
          curl -fsS http://127.0.0.1:8099/products/commercial-industrial > /tmp/products-commercial.html
          curl -fsS http://127.0.0.1:8099/products/pw-hr-20l > /tmp/product.html
          curl -fsS http://127.0.0.1:8099/faqs > /tmp/faqs.html
          curl -fsS http://127.0.0.1:8099/contact > /tmp/contact.html
          curl -fsS http://127.0.0.1:8099/about > /tmp/about.html
          curl -fsS http://127.0.0.1:8099/water-quality-maintenance > /tmp/maintenance.html
          curl -fsS http://127.0.0.1:8099/privacy > /tmp/privacy.html
          curl -fsS http://127.0.0.1:8099/terms > /tmp/terms.html
          curl -fsS http://127.0.0.1:8099/refunds > /tmp/refunds.html
          curl -fsS http://127.0.0.1:8099/cookies > /tmp/cookies.html
          curl -fsS -D /tmp/checkout-headers.txt http://127.0.0.1:8099/buy/pw-hr-20l > /tmp/checkout.html
          curl -fsS -X POST http://127.0.0.1:8099/checkout/quote/pw-hr-20l \
            -H 'Content-Type: application/json' \
            --data '{"postcode":"KA1 1AA","country_code":"GB","quantity":1}' > /tmp/quote.json
          curl -fsS http://127.0.0.1:8099/sitemap.xml > /tmp/sitemap.xml
          curl -fsS -H 'Host: watairuk.co.uk' http://127.0.0.1:8099/robots.txt > /tmp/robots.txt
          curl -fsS -D /tmp/preview-headers.txt -H 'Host: preview.example.test' http://127.0.0.1:8099/ > /tmp/preview-home.html
          curl -fsS -H 'Host: preview.example.test' http://127.0.0.1:8099/robots.txt > /tmp/preview-robots.txt
          curl -fsS http://127.0.0.1:8099/.well-known/security.txt > /tmp/security.txt
          curl -fsSL http://127.0.0.1:8099/favicon.ico > /tmp/favicon.svg

          curl -sS -o /tmp/notfound.html -w '%{http_code}' http://127.0.0.1:8099/definitely-not-a-page > /tmp/notfound-status.txt

          curl -sS -o /tmp/contact-invalid.html -w '%{http_code}' \
            -X POST http://127.0.0.1:8099/contact \
            --data-urlencode 'name=CI Invalid' \
            --data-urlencode 'email=not-an-email' \
            --data-urlencode 'message=Testing invalid email validation.' \
            > /tmp/contact-invalid-status.txt

          curl -sS -D /tmp/contact-valid-headers.txt -o /dev/null \
            -X POST http://127.0.0.1:8099/contact \
            --data-urlencode 'name=CI Contact' \
            --data-urlencode 'company=WatAir CI' \
            --data-urlencode 'email=ci-contact@example.com' \
            --data-urlencode 'interest=General enquiry' \
            --data-urlencode 'message=Automated release smoke test enquiry.'

          curl -sS -D /tmp/reseller-headers.txt -o /dev/null http://127.0.0.1:8099/reseller
          curl -sS -D /tmp/old-15-headers.txt -o /dev/null http://127.0.0.1:8099/products/pw-hr-15l
          curl -sS -D /tmp/leasing-headers.txt -o /dev/null http://127.0.0.1:8099/leasing
          curl -fsS http://127.0.0.1:8099/images/logo-header.svg > /tmp/logo.svg
          curl -fsS -I http://127.0.0.1:8099/images/pw-hr-20l.webp > /tmp/product-image-headers.txt
          curl -sS -D /tmp/admin-headers.txt -o /dev/null http://127.0.0.1:8099/admin/login
          curl -sS -D /tmp/home-headers.txt -o /dev/null http://127.0.0.1:8099/

          ANON_CSRF=$(node -e "const crypto=require('crypto'); process.stdout.write(crypto.createHmac('sha256',process.env.SESSION_SECRET).update('anonymous').digest('hex'))")
          curl -sS -D /tmp/checkout-order-headers.txt -o /dev/null \
            -X POST http://127.0.0.1:8099/checkout/pw-hr-20l \
            --data-urlencode "_csrf=$ANON_CSRF" \
            --data-urlencode 'customer_name=CI Buyer' \
            --data-urlencode 'customer_email=buyer@example.com' \
            --data-urlencode 'customer_phone=01234 567890' \
            --data-urlencode 'address1=1 Test Street' \
            --data-urlencode 'city=Kilmarnock' \
            --data-urlencode 'region=Ayrshire' \
            --data-urlencode 'postcode=KA1 1AA' \
            --data-urlencode 'country_code=GB' \
            --data-urlencode 'quantity=1' \
            --data-urlencode 'gateway=manual' \
            --data-urlencode 'accept_terms=1'
          ORDER_PATH=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' /tmp/checkout-order-headers.txt | tr -d '\r' | tail -1)
          test -n "$ORDER_PATH"
          curl -fsS -D /tmp/order-headers.txt "http://127.0.0.1:8099$ORDER_PATH" > /tmp/order.html

          grep -q 'application/ld+json' /tmp/home.html
          grep -q '<link rel="canonical" href="http://127.0.0.1:8099/">' /tmp/home.html
          grep -q '<meta property="og:url" content="http://127.0.0.1:8099/">' /tmp/home.html
          grep -q '<link rel="canonical" href="http://preview.example.test/">' /tmp/preview-home.html
          grep -q '<meta property="og:url" content="http://preview.example.test/">' /tmp/preview-home.html
          ! grep -q 'watairuk.co.uk' /tmp/preview-home.html
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/preview-headers.txt
          grep -q '^Disallow: /
          grep -q 'Skip to main content' /tmp/home.html
          grep -q 'id="main-content"' /tmp/home.html
          grep -q '"@type":"Product"' /tmp/product.html
          grep -q '"@type":"Offer"' /tmp/product.html
          grep -q 'Buy now' /tmp/product.html
          grep -q '£1,299.00' /tmp/product.html
          grep -q '20 Litres/day at 30°C &amp; 80% RH' /tmp/product.html
          grep -q '53.1 × 30.7 × 58 cm' /tmp/product.html
          grep -q 'PW HR-20L' /tmp/products-home.html
          grep -q 'CI catalogue eyebrow' /tmp/products.html
          grep -q 'CI editable catalogue hero' /tmp/products.html
          grep -q 'Catalogue hero content managed from Site Settings.' /tmp/products.html
          grep -q '/uploads/imported/legacy/media/1070/10000l-pro.png' /tmp/products.html
          ! grep -q 'CI editable catalogue hero' /tmp/products-home.html
          ! grep -q 'CI editable catalogue hero' /tmp/products-commercial.html
          grep -q '20–10,000' /tmp/home.html
          grep -q 'Atmospheric Water Generation solutions.' /tmp/home.html
          ! grep -q 'UK and Overseas' /tmp/home.html
          ! grep -q 'Atmospheric Water Generation · United Kingdom' /tmp/home.html
          grep -q 'home-photo-hero' /tmp/home.html
          grep -q 'PW HR-60L' /tmp/products-home.html
          grep -q 'PW HR-80L' /tmp/products-commercial.html
          grep -q 'PW HR-10000L' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-100l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-250l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-500l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-1000l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-3000l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-5000l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-10000l"' /tmp/products-commercial.html
          grep -q 'Choose a model' /tmp/products-home.html
          grep -q 'Choose a model' /tmp/products-commercial.html
          grep -q 'data-capacity-filter="80-250"' /tmp/products-commercial.html
          grep -q 'data-faq-search' /tmp/faqs.html
          grep -q '/uploads/imported/legacy/media/1070/10000l-pro.png' /tmp/faqs.html
          grep -q '"@type":"FAQPage"' /tmp/faqs.html
          grep -q '"@type":"BreadcrumbList"' /tmp/about.html
          grep -q 'Good water quality depends on correct operation and maintenance' /tmp/maintenance.html
          grep -q 'hero-has-photo' /tmp/maintenance.html
          grep -q '/uploads/imported/legacy/media/1027/contact-banner.jpg' /tmp/maintenance.html
          grep -q 'The operator/user manual supplied for the specific WatAir model is the controlling instruction' /tmp/maintenance.html
          grep -q 'Legionella and microbiological risk' /tmp/maintenance.html
          grep -q 'hse.gov.uk/legionnaires/' /tmp/maintenance.html
          grep -q 'Safe drinking water depends on correct operation and maintenance.' /tmp/product.html
          grep -q 'operation, water-quality and maintenance requirements' /tmp/checkout.html
          grep -q 'Operation, water hygiene and maintenance' /tmp/terms.html
          grep -q 'How WatAir handles information' /tmp/privacy.html
          grep -q 'Orders and payments' /tmp/privacy.html
          grep -q 'Terms for purchases made through the WatAir website' /tmp/terms.html
          grep -q 'Refunds, cancellations and returns' /tmp/refunds.html
          grep -q 'Your cookie and privacy choices' /tmp/cookies.html
          grep -q 'Secure checkout' /tmp/checkout.html
          grep -q '"delivery_minor":2500' /tmp/quote.json
          grep -q '"total_minor":132400' /tmp/quote.json
          grep -q 'Order received.' /tmp/order.html
          grep -q 'manual payment arrangement' /tmp/order.html
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/checkout-headers.txt
          grep -qi '^cache-control: no-store' /tmp/checkout-headers.txt
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/order-headers.txt
          grep -qi '^cache-control: no-store' /tmp/order-headers.txt
          grep -q 'data-cookie-consent' /tmp/home.html
          grep -q 'privacy notice' /tmp/contact.html
          grep -q 'How many people?' /tmp/contact.html
          grep -q '<strong>Direct</strong> project support' /tmp/contact.html
          ! grep -q '<strong>UK</strong> project support' /tmp/contact.html
          grep -q 'we can discuss the next step.' /tmp/about.html
          ! grep -q 'we can discuss the right next step.' /tmp/about.html
          grep -q 'Atmospheric Water Generation solutions</small>' /tmp/about.html
          grep -q 'WatAir promotes Atmospheric Water Generation technology' /tmp/about.html
          grep -q '<loc>https://watairuk.co.uk/water-quality-maintenance</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://watairuk.co.uk/privacy</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://watairuk.co.uk/terms</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://watairuk.co.uk/refunds</loc>' /tmp/sitemap.xml
          grep -q '<loc>https://watairuk.co.uk/cookies</loc>' /tmp/sitemap.xml
          grep -q 'Sitemap: https://watairuk.co.uk/sitemap.xml' /tmp/robots.txt
          grep -q 'Disallow: /order/' /tmp/robots.txt
          grep -q 'Canonical: https://watairuk.co.uk/.well-known/security.txt' /tmp/security.txt
          grep -q "rel=\"icon\" href=\"/favicon.svg?v=${APP_VERSION}\"" /tmp/home.html
          grep -q '<svg' /tmp/favicon.svg
          grep -q '^404$' /tmp/notfound-status.txt
          grep -q 'Page not found' /tmp/notfound.html
          grep -q '^400$' /tmp/contact-invalid-status.txt
          grep -q 'valid email address' /tmp/contact-invalid.html
          grep -q 'CI Invalid' /tmp/contact-invalid.html
          grep -q '303' /tmp/contact-valid-headers.txt
          grep -qi '^location: /contact?sent=1' /tmp/contact-valid-headers.txt
          grep -q '301' /tmp/reseller-headers.txt
          grep -qi '^location: /resellers' /tmp/reseller-headers.txt
          grep -q '301' /tmp/old-15-headers.txt
          grep -qi '^location: /products/pw-hr-20l' /tmp/old-15-headers.txt
          grep -q '301' /tmp/leasing-headers.txt
          grep -qi '^location: /contact' /tmp/leasing-headers.txt
          grep -q '#00a9e1' /tmp/logo.svg
          grep -qi '^content-type: image/webp' /tmp/product-image-headers.txt
          ! grep -q 'Leasing Available' /tmp/home.html
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive' /tmp/admin-headers.txt
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=(), payment=()' /tmp/home-headers.txt

          TOKEN=$(node -e "const jwt=require('jsonwebtoken'); process.stdout.write(jwt.sign({sub:1,email:'ci@example.com',role:'admin'}, process.env.SESSION_SECRET,{expiresIn:'1h'}))")
          AUTH="Cookie: watair_admin=$TOKEN"

          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin > /tmp/admin-dashboard.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/products > /tmp/admin-products.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/products/new > /tmp/admin-product-new.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/products/1 > /tmp/admin-product-edit.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/pages/1 > /tmp/admin-page-edit.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/media > /tmp/admin-media.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/settings > /tmp/admin-settings.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/users > /tmp/admin-users.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/enquiries > /tmp/admin-enquiries.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/commerce > /tmp/admin-commerce.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/orders > /tmp/admin-orders.html
          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/media/assets.json > /tmp/admin-assets.json

          grep -q 'Welcome back' /tmp/admin-dashboard.html
          grep -q 'Launch checks' /tmp/admin-dashboard.html
          grep -q 'Water quality guidance' /tmp/admin-dashboard.html
          grep -q 'Add product' /tmp/admin-product-new.html
          grep -q 'Technical specifications' /tmp/admin-product-edit.html
          grep -q 'Delete product permanently' /tmp/admin-product-edit.html
          grep -q 'Sell online' /tmp/admin-product-edit.html
          grep -q 'Customer price' /tmp/admin-product-edit.html
          grep -q 'Delivery class' /tmp/admin-product-edit.html
          grep -q 'Page content' /tmp/admin-page-edit.html
          grep -q 'Upload an image' /tmp/admin-media.html
          grep -q 'Homepage hero image' /tmp/admin-settings.html
          grep -q 'Catalogue hero' /tmp/admin-settings.html
          grep -q 'Catalogue hero image' /tmp/admin-settings.html
          grep -q 'Facebook URL' /tmp/admin-settings.html
          grep -q 'Instagram URL' /tmp/admin-settings.html
          grep -q 'LinkedIn URL' /tmp/admin-settings.html
          grep -q 'Email delivery (SMTP)' /tmp/admin-settings.html
          grep -q 'Save & send test email' /tmp/admin-settings.html
          grep -q 'https://uk.linkedin.com/company/watair-uk' /tmp/home.html
          grep -q 'Add an admin user' /tmp/admin-users.html
          grep -q 'Generate secure password' /tmp/admin-users.html
          grep -q 'CI Contact' /tmp/admin-enquiries.html
          grep -q 'Delete enquiry' /tmp/admin-enquiries.html
          grep -q 'Payment gateways' /tmp/admin-commerce.html
          grep -q 'Delivery rules' /tmp/admin-commerce.html
          grep -q 'CI Buyer' /tmp/admin-orders.html
          grep -q '£1,324.00' /tmp/admin-orders.html
          grep -q '"assets"' /tmp/admin-assets.json

          ADMIN_CSRF=$(TOKEN="$TOKEN" node -e "const crypto=require('crypto'); process.stdout.write(crypto.createHmac('sha256',process.env.SESSION_SECRET).update(process.env.TOKEN).digest('hex'))")
          curl -sS -o /dev/null -D /tmp/smtp-save-headers.txt \
            -H "$AUTH" \
            -X POST http://127.0.0.1:8099/admin/settings \
            --data-urlencode "_csrf=$ADMIN_CSRF" \
            --data-urlencode 'site_name=WatAir UK' \
            --data-urlencode 'company_location=Glasgow, United Kingdom' \
            --data-urlencode 'email=info@watairuk.co.uk' \
            --data-urlencode 'phone=0141 442 0201' \
            --data-urlencode 'footer_text=Atmospheric Water Generation solutions.' \
            --data-urlencode 'hero_title=Water from air. Wherever you need it.' \
            --data-urlencode 'hero_text=Atmospheric Water Generation for homes, workplaces and industrial-scale applications, producing fresh water directly from ambient air.' \
            --data-urlencode 'hero_image=/uploads/imported/legacy/media/1027/contact-banner.jpg' \
            --data-urlencode 'hero_image_style=photo' \
            --data-urlencode 'catalogue_hero_eyebrow=Atmospheric Water Generators' \
            --data-urlencode 'catalogue_hero_title=Water generation at every scale' \
            --data-urlencode 'catalogue_hero_text=From compact systems to industrial-scale generation.' \
            --data-urlencode 'catalogue_hero_image=/uploads/imported/legacy/images/home/products.jpg' \
            --data-urlencode 'catalogue_hero_image_style=graphic' \
            --data-urlencode 'linkedin_url=https://uk.linkedin.com/company/watair-uk' \
            --data-urlencode 'smtp_enabled=1' \
            --data-urlencode 'smtp_host=smtp.example.test' \
            --data-urlencode 'smtp_port=587' \
            --data-urlencode 'smtp_user=ci-smtp-user' \
            --data-urlencode 'smtp_password=CI-SMTP-secret-987654321' \
            --data-urlencode 'smtp_from=WatAir CI <ci@example.com>' \
            --data-urlencode 'smtp_to=ci@example.com'

          grep -q '302' /tmp/smtp-save-headers.txt
          node <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database('data/watair.db');
          const secret = db.prepare("SELECT value FROM app_secrets WHERE key='smtp_password'").get();
          if (!secret || !secret.value.startsWith('v1.') || secret.value.includes('CI-SMTP-secret-987654321')) {
            throw new Error('SMTP password was not stored as encrypted secret data');
          }
          if (db.prepare("SELECT 1 FROM settings WHERE key='smtp_password'").get()) {
            throw new Error('SMTP password leaked into ordinary settings');
          }
          const smtpHost = db.prepare("SELECT value FROM settings WHERE key='smtp_host'").get();
          if (smtpHost?.value !== 'smtp.example.test') throw new Error('SMTP host was not saved');
          db.close();
          NODE

          curl -fsS -H "$AUTH" http://127.0.0.1:8099/admin/settings > /tmp/admin-settings-smtp.html
          grep -q 'Using CMS configuration' /tmp/admin-settings-smtp.html
          grep -q 'encrypted CMS password is stored' /tmp/admin-settings-smtp.html
          ! grep -q 'CI-SMTP-secret-987654321' /tmp/admin-settings-smtp.html

      - name: Reject unsafe first-boot admin credentials
        env:
          NODE_ENV: production
          PORT: 8100
          BASE_URL: https://watairuk.co.uk
          SESSION_SECRET: ci-only-session-secret-12345678901234567890
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: replace-with-a-long-unique-password
        run: |
          set -euo pipefail
          rm -rf data
          set +e
          node server.js > /tmp/unsafe-bootstrap.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -q 'Refusing to create the first production admin with example credentials' /tmp/unsafe-bootstrap.log

      - name: Validate production Docker configuration
        run: |
          cp .env.example .env
          docker compose config > /dev/null
          docker build -t watair-ci .
 /tmp/preview-robots.txt
          ! grep -qi '^location:' /tmp/preview-headers.txt
          grep -q 'Skip to main content' /tmp/home.html
          grep -q 'id="main-content"' /tmp/home.html
          grep -q '"@type":"Product"' /tmp/product.html
          grep -q '"@type":"Offer"' /tmp/product.html
          grep -q 'Buy now' /tmp/product.html
          grep -q '£1,299.00' /tmp/product.html
          grep -q '20 Litres/day at 30°C &amp; 80% RH' /tmp/product.html
          grep -q '53.1 × 30.7 × 58 cm' /tmp/product.html
          grep -q 'PW HR-20L' /tmp/products-home.html
          grep -q 'CI catalogue eyebrow' /tmp/products.html
          grep -q 'CI editable catalogue hero' /tmp/products.html
          grep -q 'Catalogue hero content managed from Site Settings.' /tmp/products.html
          grep -q '/uploads/imported/legacy/media/1070/10000l-pro.png' /tmp/products.html
          ! grep -q 'CI editable catalogue hero' /tmp/products-home.html
          ! grep -q 'CI editable catalogue hero' /tmp/products-commercial.html
          grep -q '20–10,000' /tmp/home.html
          grep -q 'Atmospheric Water Generation solutions.' /tmp/home.html
          ! grep -q 'UK and Overseas' /tmp/home.html
          ! grep -q 'Atmospheric Water Generation · United Kingdom' /tmp/home.html
          grep -q 'home-photo-hero' /tmp/home.html
          grep -q 'PW HR-60L' /tmp/products-home.html
          grep -q 'PW HR-80L' /tmp/products-commercial.html
          grep -q 'PW HR-10000L' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-100l"' /tmp/products-commercial.html
          ! grep -q 'href="/products/pw-hr-250l"' /tmp/products-commercial.html

name: WatAir CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --omit=dev
      - run: npm run check
      - name: Smoke test
        env:
          NODE_ENV: production
          PORT: 8099
          SESSION_SECRET: ci-only-session-secret-12345678901234567890
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-test-password-123456789
        run: |
          node server.js > /tmp/watair.log 2>&1 &
          APP_PID=$!
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8099/health; then
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          cat /tmp/watair.log
          kill $APP_PID || true
          exit 1
